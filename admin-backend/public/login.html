<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Marquinhos Climatização | Login</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Painel Marquinhos Climatização</h1>
    <p class="sub">Entre para editar o site, os serviços, os trabalhos e a agenda.</p>
    <div id="erroBox"></div>
    <form id="formLogin">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
