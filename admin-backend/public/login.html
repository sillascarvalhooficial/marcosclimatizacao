<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Marcos Climatização e Elétrica | Login</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Painel Marcos Climatização e Elétrica</h1>
    <p class="sub">Entre para editar o site, os serviços, os trabalhos e a agenda.</p>
    <div id="erroBox"></div>
    <form id="formLogin">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <button type="button" id="btnEsqueciSenha" class="link-esqueci-senha">Esqueci minha senha</button>

    <form id="formResetarSenha" hidden>
      <p class="sub">Redefina a senha usando a senha mestre (não precisa da senha atual).</p>
      <div class="campo">
        <label for="resetUsuario">Usuário</label>
        <input type="text" id="resetUsuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="resetSenhaMestre">Senha mestre</label>
        <input type="password" id="resetSenhaMestre" required>
      </div>
      <div class="campo">
        <label for="resetNovaSenha">Nova senha</label>
        <input type="password" id="resetNovaSenha" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary">Redefinir senha</button>
      <button type="button" id="btnCancelarReset" class="link-esqueci-senha">Voltar pro login</button>
    </form>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
